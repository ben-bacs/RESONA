[package]
name = "resona"
version = "0.1.2"
description = "Music-Reactive Idle Visualizer for Windows 11"
authors = ["Benedict Neil D. Bacud"]
edition = "2021"

[lib]
name = "resona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", default-features = false }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints"
] }
